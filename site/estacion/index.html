<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="Curionaut: tu estación de juegos para aprender, con un mentor que te acompaña.">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Curionaut · Estación</title>
<link rel="stylesheet" href="estacion.css">
</head>
<body>
<div id="fondo" class="fx f-orbita" aria-hidden="true"><i></i><b></b></div>
<header class="top"><div class="wrap top-in">
  <a class="logo" href="../" aria-label="Curionaut" style="color:inherit;text-decoration:none"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffbf7a"/><stop offset="1" stop-color="#b8733d"/></linearGradient></defs><circle cx="32" cy="32" r="29" fill="#141c33" stroke="url(#lg1)" stroke-width="4"/><ellipse cx="32" cy="32" rx="25" ry="9" fill="none" stroke="#5ee0ff" stroke-width="2.5" transform="rotate(-24 32 32)"/><circle cx="32" cy="32" r="10" fill="url(#lg1)"/><circle cx="51" cy="22" r="4" fill="#5ee0ff"/></svg><span class="lt">Curionaut</span></a>
  <nav class="navtop" id="navTop" hidden><a href="#inicio" data-go="inicio" class="on" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span data-t="nav.inicio"></span></a><a href="#juegos" data-go="juegos"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15 12h.01M18 13h.01"/></svg><span data-t="nav.juegos"></span></a><a href="#monedero" data-go="monedero"><svg viewBox="0 0 24 24"><path d="M13 2L5 13h6l-1 9 8-12h-6z"/></svg><span data-t="nav.monedero"></span></a><a href="#pasaporte" data-go="pasaporte"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16h6"/></svg><span data-t="nav.pasaporte"></span></a><a href="#yo" data-go="yo"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg><span data-t="nav.yo"></span></a></nav>
  <a class="wal" id="wal" href="#monedero" data-go="monedero"><span class="sr" data-t="nav.monedero"></span><span class="we"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L5 13h6l-1 9 8-12h-6z" fill="currentColor"/></svg><b id="wE">0</b><span class="sr" data-t="w.energy"></span></span><span class="wc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z" fill="currentColor"/><path d="M2 9h20M9 3l-2 6 5 12 5-12-2-6" fill="none" stroke="#04121a" stroke-width="1.2" opacity=".55"/></svg><b id="wC">0</b><span class="sr" data-t="w.crystals"></span></span></a>
  <div class="lvl" id="lvl"><b id="lvN">1</b><div><small id="lvT">0 XP</small><div class="bar"><i id="lvB" style="width:0"></i></div></div></div>
  <i class="sync" id="sync" title=""></i>
  <button class="ibtn" id="btnSet"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></button>
</div></header>

<main class="wrap" id="app">
  <section class="login-hero" id="login" hidden>
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#141c33" stroke="#f2a65a" stroke-width="4"/><ellipse cx="32" cy="32" rx="25" ry="9" fill="none" stroke="#5ee0ff" stroke-width="2.5" transform="rotate(-24 32 32)"/><circle cx="32" cy="32" r="10" fill="#f2a65a"/></svg>
    <h1 style="font:800 30px var(--fd);margin:10px 0 4px" data-t="app.name"></h1>
    <p class="muted" data-t="login.lead"></p>
    <div class="card" style="text-align:left;margin-top:18px">
      <div class="field"><label for="lgMail" data-t="login.mail"></label><input id="lgMail" type="email" autocomplete="username" inputmode="email"></div>
      <div class="field"><label for="lgPass" data-t="login.pass"></label><input id="lgPass" type="password" autocomplete="current-password"></div>
      <p class="msg" id="lgMsg" aria-live="polite"></p>
      <div class="row" style="justify-content:space-between"><button class="btn" id="lgLocal" data-t="login.local"></button><button class="btn pri" id="lgGo" data-t="login.go"></button></div>
    </div>
    <p style="margin-top:14px"><button class="btn sm" id="lgLang"></button></p>
  </section>

  <div id="main" hidden>
    <section class="hero" id="hero">
      <a class="hav" id="heroAv" href="#yo" data-go="yo"></a>
      <div class="htx"><h1 id="hi"></h1><p class="htit" id="heroTit"></p><p id="today"></p></div>
      <div class="clock" id="clock" aria-hidden="true">--:--</div>
    </section>

    <!-- ===== Inicio ===== -->
    <div class="view" id="v-inicio"><div class="grid">
      <section class="card c-mentor" id="mentor"><h2><span class="ico"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></span><span data-t="mentor.card"></span><button class="btn sm act" id="openBook" data-t="mentor.book"></button></h2>
        <div id="mentorBox"></div></section>
      <section class="card c-nuevo" id="nuevo"><h2><span class="ico"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.4l6-.8z"/></svg></span><span data-t="card.new"></span></h2>
        <div id="nuevoBox"></div></section>
      <section class="card c-hoy" id="hoy"><h2><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span data-t="card.today"></span></h2>
        <div id="nowBox"></div><ul class="agenda" id="agenda"></ul></section>
      <section class="card c-cole" id="cole"><h2><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 10l9-5 9 5-9 5z"/><path d="M7 12v4c3 2 7 2 10 0v-4"/></svg></span><span data-t="card.school"></span><button class="btn sm act" id="editLinks"></button></h2>
        <div class="links" id="links"></div></section>
      <section class="card c-rut" id="rut"><h2><span class="ico"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg></span>Rutinator</h2>
        <div id="rutBox"></div></section>
      <section class="card c-notas" id="notas"><h2><span class="ico"><svg viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4z"/><path d="M8 10h8M8 14h8M8 18h5"/></svg></span><span data-t="card.notes"></span></h2>
        <form class="addnote" id="noteForm" autocomplete="off"><input type="text" id="noteIn" maxlength="140"><button class="btn pri" type="submit" data-t="notes.add"></button></form>
        <div class="chips" id="dueChips" role="group"><button type="button" class="chip on" data-due="" data-t="due.none"></button><button type="button" class="chip" data-due="0" data-t="due.today"></button><button type="button" class="chip" data-due="1" data-t="due.tomorrow"></button><label class="chip" data-due="x">📅 <input type="date" id="dueDate"></label></div>
        <ul class="notes" id="notesList"></ul></section>
    </div></div>

    <!-- ===== Juegos ===== -->
    <div class="view" id="v-juegos" hidden>
      <section class="card c-oferta" id="oferta"></section>
      <section class="card c-juegos" id="juegos"><h2><span class="ico"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15 12h.01M18 13h.01"/></svg></span><span data-t="card.games"></span></h2>
        <div class="games" id="games"></div></section>
    </div>

    <!-- ===== Monedero ===== -->
    <div class="view" id="v-monedero" hidden><div id="monBox"></div></div>
    <!-- ===== Pasaporte ===== -->
    <div class="view" id="v-pasaporte" hidden><div id="pasBox"></div></div>
    <!-- ===== Yo ===== -->
    <div class="view" id="v-yo" hidden><div id="yoBox"></div></div>

    <p class="foot" id="foot"></p>
  </div>
</main>

<nav class="bottom" id="nav" hidden><a href="#inicio" data-go="inicio" class="on" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span data-t="nav.inicio"></span></a><a href="#juegos" data-go="juegos"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15 12h.01M18 13h.01"/></svg><span data-t="nav.juegos"></span></a><a href="#monedero" data-go="monedero"><svg viewBox="0 0 24 24"><path d="M13 2L5 13h6l-1 9 8-12h-6z"/></svg><span data-t="nav.monedero"></span></a><a href="#pasaporte" data-go="pasaporte"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M9 16h6"/></svg><span data-t="nav.pasaporte"></span></a><a href="#yo" data-go="yo"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg><span data-t="nav.yo"></span></a></nav>

<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js"></script>
<script src="mentores.js"></script>
<script src="economia.js"></script>
<script src="arte.js"></script>
<script src="app.js"></script>
</body>
</html>
